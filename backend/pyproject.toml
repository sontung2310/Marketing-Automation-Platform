[project]
name = "marketing-automation-backend"
version = "0.1.0"
description = "Marketing Automation Platform PoC: Strategy and Execution agents over a Marketing Intelligence MCP."
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pymongo>=4.10",
    "sse-starlette>=2.1",
    "openai-agents>=0.3",
    "mcp>=2.2,<3",
    "httpx>=0.27",
    "python-ulid>=3.0",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "import-linter>=2.1",
    "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests", "evals"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "ASYNC", "T20"]

[tool.ruff.lint.isort]
known-first-party = ["app", "evals"]
# The OpenAI Agents SDK package; not our app/agents folder.
known-third-party = ["agents"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.11"
strict = true
packages = ["app"]
plugins = ["pydantic.mypy"]

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: needs a real MongoDB (MONGODB_URI); run with -m integration",
]
addopts = "-m 'not integration' --strict-markers"

# ---------------------------------------------------------------- import-linter
# Enforces the layering rules in AGENTS.md §2.
[tool.importlinter]
root_package = "app"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Request flow is layered: api -> orchestration -> agents"
type = "layers"
layers = [
    "app.api",
    "app.orchestration",
    "app.agents",
]

[[tool.importlinter.contracts]]
name = "Only repositories, pipeline sources and core.db touch MongoDB"
type = "forbidden"
source_modules = [
    "app.api",
    "app.orchestration",
    "app.agents",
    "app.mcp_server",
    "app.skills",
    "app.connectors",
]
forbidden_modules = ["pymongo", "bson"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Agents get data only through the Intelligence MCP and never execute side effects"
type = "forbidden"
source_modules = ["app.agents"]
forbidden_modules = [
    "app.intelligence.repositories",
    "app.pipelines",
    "app.connectors",
    "app.api",
]

[[tool.importlinter.contracts]]
name = "Strategy and Execution agents are independent"
type = "independence"
modules = [
    "app.agents.strategy",
    "app.agents.execution",
]

[[tool.importlinter.contracts]]
name = "The Intelligence MCP server is read-only infrastructure"
type = "forbidden"
source_modules = ["app.mcp_server"]
forbidden_modules = [
    "app.agents",
    "app.orchestration",
    "app.pipelines",
    "app.connectors",
    "app.api",
]

[[tool.importlinter.contracts]]
name = "Skills read only the committed catalogue: no data, MCP or network access"
type = "forbidden"
source_modules = ["app.skills"]
forbidden_modules = [
    "app.intelligence",
    "app.mcp_server",
    "app.pipelines",
    "app.connectors",
    "app.orchestration",
    "app.api",
    "httpx",
]
allow_indirect_imports = true
