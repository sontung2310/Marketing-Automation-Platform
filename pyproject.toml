[project]
name = "marketing-automation"
version = "0.1.0"
description = "Marketing Automation Platform PoC: Strategy and Execution agents over a Marketing Intelligence MCP."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pymongo>=4.10",
    "sse-starlette>=2.1",
    "openai-agents>=0.3",
    "mcp>=1.9",
    "httpx>=0.27",
    "python-ulid>=3.0",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "import-linter>=2.1",
    "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/src/marketing_automation"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["backend/src", "tests", "evals", "scripts"]
extend-exclude = ["docs", "openspec", "frontend"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "ASYNC", "T20"]

[tool.ruff.lint.per-file-ignores]
"scripts/**" = ["T20"]

[tool.ruff.lint.isort]
known-first-party = ["marketing_automation"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "backend/src"
packages = ["marketing_automation"]
plugins = ["pydantic.mypy"]

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: needs a real MongoDB (MONGODB_URI); run with -m integration",
]
addopts = "-m 'not integration' --strict-markers"

# ---------------------------------------------------------------- import-linter
# Enforces the layering rules in AGENTS.md §2.
[tool.importlinter]
root_package = "marketing_automation"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Request flow is layered: api -> orchestration -> agents"
type = "layers"
layers = [
    "marketing_automation.api",
    "marketing_automation.orchestration",
    "marketing_automation.agents",
]

[[tool.importlinter.contracts]]
name = "Only repositories, pipeline sources and core.db touch MongoDB"
type = "forbidden"
source_modules = [
    "marketing_automation.api",
    "marketing_automation.orchestration",
    "marketing_automation.agents",
    "marketing_automation.mcp_server",
    "marketing_automation.skills",
    "marketing_automation.connectors",
]
forbidden_modules = ["pymongo", "bson"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Agents get data only through the Intelligence MCP and never execute side effects"
type = "forbidden"
source_modules = ["marketing_automation.agents"]
forbidden_modules = [
    "marketing_automation.intelligence.repositories",
    "marketing_automation.pipelines",
    "marketing_automation.connectors",
    "marketing_automation.api",
]

[[tool.importlinter.contracts]]
name = "Strategy and Execution agents are independent"
type = "independence"
modules = [
    "marketing_automation.agents.strategy",
    "marketing_automation.agents.execution",
]

[[tool.importlinter.contracts]]
name = "The Intelligence MCP server is read-only infrastructure"
type = "forbidden"
source_modules = ["marketing_automation.mcp_server"]
forbidden_modules = [
    "marketing_automation.agents",
    "marketing_automation.orchestration",
    "marketing_automation.pipelines",
    "marketing_automation.connectors",
    "marketing_automation.api",
]
