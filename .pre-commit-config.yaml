# Fast local gates. CI (.github/workflows/ci.yml) runs the full set.
# Vendored skills (.agents/skills, .claude/skills) stay byte-identical to upstream so
# skills-lock.json hashes keep matching; update them with `npx skills update`.
exclude: ^(\.agents|\.claude)/skills/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: ["--markdown-linebreak-ext=md"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: import-linter
        name: layering contracts (import-linter)
        entry: uv run lint-imports
        language: system
        pass_filenames: false
        files: ^backend/src/
      - id: openspec-conflicts
        name: OpenSpec cross-change conflicts
        entry: uv run python -m scripts.ci.check_openspec
        language: system
        pass_filenames: false
        files: ^(openspec/|docs/roadmap\.md)
