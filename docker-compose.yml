# Local PoC stack (docs/specs.md §4). The Intelligence MCP service is added in roadmap Step 2.3.
services:
  api:
    build: ./backend
    env_file: .env
    ports: ["8000:8000"]

  web:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -w frontend -- --host 0.0.0.0"
    environment:
      VITE_API_PROXY: http://api:8000
    volumes:
      - .:/app
      - web-node-modules:/app/node_modules
    ports: ["5173:5173"]
    depends_on: [api]

  # Throwaway MongoDB for integration tests and evals: docker compose --profile test up mongo
  mongo:
    image: mongo:7
    profiles: ["test"]
    ports: ["27017:27017"]

volumes:
  web-node-modules:
