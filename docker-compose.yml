# Local PoC stack (docs/specs.md §4), including the Step 2.3 Intelligence MCP service.
services:
  api:
    build: ./backend
    env_file: .env
    environment:
      MCP_URL: http://mcp:8001/mcp
    ports: ["8000:8000"]

  mcp:
    build: ./backend
    env_file: .env
    command: uvicorn app.mcp_server.main:app --host 0.0.0.0 --port 8001
    ports: ["8001:8001"]

  # Bounded local scheduler for the read-only source pipelines (15 minutes).
  pipelines:
    build: ./backend
    env_file: .env
    command: sh -c "while true; do python scripts/run_pipelines.py; sleep 900; done"
    restart: unless-stopped

  web:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -w frontend -- --host 0.0.0.0"
    environment:
      VITE_API_PROXY: http://api:8000
    volumes:
      - .:/app
      - web-node-modules:/app/node_modules
    ports: ["5173:5173"]
    depends_on: [api]

  # Throwaway MongoDB for integration tests and evals: docker compose --profile test up mongo
  mongo:
    image: mongo:7
    profiles: ["test"]
    ports: ["27017:27017"]

volumes:
  web-node-modules:
