name: CD

# Deploys only after CI has passed for the same commit.
#   PR          -> Vercel preview (URL commented on the PR)
#   push main   -> Vercel production + backend image to GHCR
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: cd-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  IS_PRODUCTION: ${{ github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' }}

jobs:
  frontend-vercel:
    name: Frontend → Vercel (${{ github.event.workflow_run.event == 'push' && 'production' || 'preview' }})
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.event == 'pull_request' ||
       (github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-latest
    environment: ${{ github.event.workflow_run.event == 'push' && 'production' || 'preview' }}
    permissions:
      contents: read
      pull-requests: write
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check Vercel secrets
        id: secrets
        working-directory: .
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [[ -z "$VERCEL_TOKEN" || -z "$VERCEL_ORG_ID" || -z "$VERCEL_PROJECT_ID" ]]; then
            echo "::notice::Vercel secrets are not configured; skipping deployment."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.secrets.outputs.ready == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: pnpm/action-setup@v6
        if: steps.secrets.outputs.ready == 'true'
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Build and deploy with Vercel CLI
        id: deploy
        if: steps.secrets.outputs.ready == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          TARGET=preview; PROD_FLAG=""
          if [[ "$IS_PRODUCTION" == "true" ]]; then TARGET=production; PROD_FLAG="--prod"; fi
          npx -y vercel@latest pull --yes --environment="$TARGET" --token="$VERCEL_TOKEN"
          npx -y vercel@latest build $PROD_FLAG --token="$VERCEL_TOKEN"
          URL=$(npx -y vercel@latest deploy --prebuilt $PROD_FLAG --token="$VERCEL_TOKEN")
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "### Vercel $TARGET: $URL" >> "$GITHUB_STEP_SUMMARY"
      - name: Comment preview URL on the PR
        if: steps.deploy.outputs.url && github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.pull_requests[0]
        uses: actions/github-script@v9
        env:
          URL: ${{ steps.deploy.outputs.url }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          PR: ${{ github.event.workflow_run.pull_requests[0].number }}
        with:
          script: |
            const marker = "<!-- vercel-preview -->";
            const body = `${marker}\n**Frontend preview:** ${process.env.URL}\n\nCommit \`${process.env.SHA.slice(0, 7)}\``;
            const issue_number = Number(process.env.PR);
            const { owner, repo } = context.repo;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  backend-image:
    name: Backend image → GHCR
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}-api
          tags: |
            type=raw,value=latest
            type=raw,value=sha-${{ github.event.workflow_run.head_sha }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Deploying this image to a host (VPS per architecture §06) is added once the target is chosen.
